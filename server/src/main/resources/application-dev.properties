spring.datasource.url=jdbc:mysql://localhost:3306/personal_finance?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloudinary-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-cloudinary-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-cloudinary-api-secret}

#mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-mail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

#Oauth2 client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}

#Plaid
plaid.client-id=${PLAID_CLIENT_ID:your-plaid-client-id}
plaid.secret=${PLAID_SECRET:your-plaid-secret}
plaid.environment=${PLAID_ENVIRONMENT:sandbox}
plaid.api-version=2020-09-14

# Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:your-gemini-api-key-here}
gemini.model-name=${GEMINI_MODEL_NAME:gemini-flash-lite-latest}
