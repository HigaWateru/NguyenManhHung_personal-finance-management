name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE_NAME: ${{ github.repository }}/server
  CLIENT_IMAGE_NAME: ${{ github.repository }}/client

jobs:
  # ----------------------------------------------------
  # 1. Frontend Test & Build Check
  # ----------------------------------------------------
  test-frontend:
    name: Test Frontend (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint
        working-directory: ./client
        run: npm run lint

      - name: Build frontend
        working-directory: ./client
        run: npm run build

  # ----------------------------------------------------
  # 2. Backend Test & Verification
  # ----------------------------------------------------
  test-backend:
    name: Test Backend (Spring Boot 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x server/gradlew

      - name: Run Backend Tests
        working-directory: ./server
        run: ./gradlew test --no-daemon

  # ----------------------------------------------------
  # 3. Build & Push Docker Images to GHCR
  # ----------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      server_image: ${{ steps.meta-server.outputs.tags }}
      client_image: ${{ steps.meta-client.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata & tags for Server
      - name: Docker metadata for Server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push Server Docker Image
      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract metadata & tags for Client
      - name: Docker metadata for Client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push Client Docker Image
      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------
  # 4. Deploy to Remote Server (VPS) via SSH
  # ----------------------------------------------------
  deploy:
    name: Deploy to Server (VPS)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SSH_HOST != ''
    steps:
      - name: Checkout code (for docker-compose)
        uses: actions/checkout@v4

      - name: Ensure target directory exists on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          script: sudo mkdir -p /opt/personal-finance && sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /opt/personal-finance

      - name: Copy docker-compose to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          source: "docker-compose.yml"
          target: "/opt/personal-finance"

      - name: Execute remote deployment commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          SERVER_IMAGE: ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}:latest
          CLIENT_IMAGE: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}:latest
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          envs: REGISTRY,ACTOR,GHCR_PAT,SERVER_IMAGE,CLIENT_IMAGE
          script: |
            set -e
            echo "==> Navigating to deploy directory..."
            cd /opt/personal-finance

            echo "==> Authenticating with GitHub Container Registry..."
            echo "$GHCR_PAT" | docker login $REGISTRY -u $ACTOR --password-stdin

            echo "==> Pulling latest images..."
            SERVER_IMAGE=$SERVER_IMAGE CLIENT_IMAGE=$CLIENT_IMAGE docker compose pull

            echo "==> Deploying application stack..."
            SERVER_IMAGE=$SERVER_IMAGE CLIENT_IMAGE=$CLIENT_IMAGE docker compose up -d --remove-orphans

            echo "==> Cleaning up unused images..."
            docker image prune -f

            echo "==> Deployment status:"
            docker compose ps
